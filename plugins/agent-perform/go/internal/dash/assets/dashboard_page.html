<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="180">
<title>__TITLE__</title>
<style>
/* One design system for every page.
   Colour is reserved for faults: --hot is magnitude ("this is a lot of
   money"), --warn is fault ("this is broken"), --mid is caution. Everything
   else is neutral grey plus one link colour (--accent). */
:root{
--fs-title:22px;--fs-h:15px;--fs-body:14px;--fs-small:12px;--lh:1.6;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
--r:8px;--r-s:4px;--max:1120px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang TC","Noto Sans TC",sans-serif;
--mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
--bg:#16181c;--card:#1e2126;--line:#31353c;--grid:#272a30;
--fg:#e5e7ea;--dim:#9ca3ad;--accent:#86aef2;--warn:#f0605a;--ok:#4cb866;
--mid:#d29922;--hot:#dd7b64;--head:#1e2126;--zebra:transparent;--hover:#24282e;
--quiet:#5c7d66;--chip:#2a2e35;
--warn-fg:#ff9b95;--warn-bg:#4a2220;--hot-fg:#f0a08c;--hot-bg:#452923;
--mid-fg:#e8c168;--mid-bg:#40341a;--ok-fg:#6fd185;--ok-bg:#1b3323;
--acc-fg:#9cbcf5;--acc-bg:#233250;--acc:var(--accent)}
@media (prefers-color-scheme:light){:root{
--bg:#f3f4f6;--card:#fff;--line:#dadde2;--grid:#eceef1;--fg:#1d2024;
--dim:#5e6570;--accent:#1f5bb8;--warn:#cf222e;--ok:#1a7f37;--mid:#9a6700;
--hot:#b0492f;--head:#fff;--zebra:transparent;--hover:#f6f7f9;--quiet:#6d8a79;
--chip:#eef0f3;
--warn-fg:#a40e1c;--warn-bg:#ffe3e3;--hot-fg:#8c3620;--hot-bg:#fbe6de;
--mid-fg:#6b4700;--mid-bg:#fbf0cf;--ok-fg:#0f5c28;--ok-bg:#dcf3e2;
--acc-fg:#174a99;--acc-bg:#e3ecfa}}
[data-theme=dark]{
--bg:#16181c;--card:#1e2126;--line:#31353c;--grid:#272a30;
--fg:#e5e7ea;--dim:#9ca3ad;--accent:#86aef2;--warn:#f0605a;--ok:#4cb866;
--mid:#d29922;--hot:#dd7b64;--head:#1e2126;--zebra:transparent;--hover:#24282e;
--quiet:#5c7d66;--chip:#2a2e35;
--warn-fg:#ff9b95;--warn-bg:#4a2220;--hot-fg:#f0a08c;--hot-bg:#452923;
--mid-fg:#e8c168;--mid-bg:#40341a;--ok-fg:#6fd185;--ok-bg:#1b3323;
--acc-fg:#9cbcf5;--acc-bg:#233250}
[data-theme=light]{
--bg:#f3f4f6;--card:#fff;--line:#dadde2;--grid:#eceef1;--fg:#1d2024;
--dim:#5e6570;--accent:#1f5bb8;--warn:#cf222e;--ok:#1a7f37;--mid:#9a6700;
--hot:#b0492f;--head:#fff;--zebra:transparent;--hover:#f6f7f9;--quiet:#6d8a79;
--chip:#eef0f3;
--warn-fg:#a40e1c;--warn-bg:#ffe3e3;--hot-fg:#8c3620;--hot-bg:#fbe6de;
--mid-fg:#6b4700;--mid-bg:#fbf0cf;--ok-fg:#0f5c28;--ok-bg:#dcf3e2;
--acc-fg:#174a99;--acc-bg:#e3ecfa}

/* ---------- base ---------- */
*{box-sizing:border-box}
body{margin:0;padding:0 0 64px;overflow-x:hidden;background:var(--bg);
color:var(--fg);font:var(--fs-body)/var(--lh) var(--font);
-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
@media(max-width:760px){.wrap{padding:0 14px}}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--chip);
padding:1px 5px;border-radius:var(--r-s)}
b,strong{font-weight:600}
.mono{font-family:var(--mono);font-size:.92em;color:var(--accent)}
.dim{color:var(--dim)}
.num{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- header / nav ---------- */
header{display:flex;align-items:center;gap:var(--s4);padding:18px 0;
margin-bottom:var(--s5);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font-weight:600;font-size:var(--fs-h);white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;padding:6px var(--s3);border-radius:6px;color:var(--dim);
font-size:13px}
nav a:hover{text-decoration:none;color:var(--fg)}
nav a[aria-current]{background:var(--chip);color:var(--fg);font-weight:600}
header .range{font-size:var(--fs-small);color:var(--dim);white-space:nowrap}
#theme{flex:none;background:none;color:var(--dim);border:1px solid var(--line);
border-radius:var(--r-s);width:22px;height:22px;padding:0;cursor:pointer;
font-size:11px;line-height:1;display:inline-flex;align-items:center;
justify-content:center}
#theme:hover{color:var(--fg)}
@media(max-width:760px){header{gap:var(--s2)}header .range{margin-left:auto}
nav{order:3;flex-basis:100%}}

/* ---------- page head ---------- */
.crumb{font-size:var(--fs-small);color:var(--dim);margin-bottom:var(--s1);
overflow-wrap:anywhere}
.crumb a{color:var(--dim)}
.crumb a:hover{color:var(--accent)}
h1.view{font-size:var(--fs-title);line-height:1.3;margin:22px 0 4px;
font-weight:600;overflow-wrap:anywhere;letter-spacing:-.01em}
.lede{font-size:16px;margin:0 0 18px;max-width:62em}
.lede b{color:var(--hot-fg)}
.lede.dim{color:var(--dim);font-size:var(--fs-body);margin:0 0 var(--s1)}
.lede.dim b{color:var(--fg)}
@media(max-width:760px){.lede{font-size:15px}}
.lede.foot{margin:var(--s3) 0 0}
.lede+.card,.lede+.tw,.lede+section,.resume+.card{margin-top:var(--s5)}
.wrap>p.dim{margin:var(--s2) 0 0}
.span{font-size:var(--fs-small);color:var(--dim);margin:var(--s3) 0 var(--s5)}

/* ---------- section headings ---------- */
.sec{font-size:var(--fs-h);line-height:1.4;color:var(--fg);font-weight:600;
margin:var(--s6) 0 var(--s3);padding:0;border:0}
.sec.top{font-size:var(--fs-h);margin-top:var(--s6)}
.sec.top+.sec{margin-top:0}
.sec code{font-size:.85em}
.sec2{font-size:var(--fs-h);font-weight:600;margin:var(--s6) 0 var(--s3)}
.vocab h4{font-size:var(--fs-small);color:var(--dim);margin:var(--s4) 0 var(--s1);
font-weight:600}
.vocab h4:first-child{margin-top:0}

/* ---------- surfaces: card / table frame / list ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:var(--s4) var(--s5);overflow:hidden;min-width:0}
.card h2{font-size:var(--fs-body);margin:0 0 var(--s3);color:var(--fg);
font-weight:600}
.card+.card{margin-top:var(--s3)}
.card>p{font-size:var(--fs-body);color:var(--dim);line-height:var(--lh);
margin:var(--s2) 0 0}
.card>p.lvl{color:var(--fg);margin-top:0}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);
max-width:100%;background:var(--card)}
/* a table inside a card does not draw a second frame */
.card .tw{border:0;border-radius:0;margin:0 calc(-1*var(--s5));max-width:none}
.card .tw th:first-child,.card .tw td:first-child{padding-left:var(--s5)}
.card .tw th:last-child,.card .tw td:last-child{padding-right:var(--s5)}
.card>.tw:first-child,.card>h2+.tw{margin-top:0}
.card>.tw:last-child{margin-bottom:calc(-1*var(--s4))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
gap:var(--s3)}
.grid>*,.hero>*{min-width:0}
.empty{background:transparent;color:var(--dim);font-size:var(--fs-small);
line-height:var(--lh);padding:var(--s4);border:1px dashed var(--line);
border-radius:var(--r)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th{text-align:left;color:var(--dim);font-weight:500;font-size:var(--fs-small);
padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);
white-space:nowrap;background:var(--head);vertical-align:bottom}
td{padding:9px var(--s3);border-bottom:1px solid var(--grid);white-space:nowrap;
vertical-align:middle;line-height:1.45}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
table.click tbody tr{cursor:pointer}
th.num,td.num{text-align:right}
th.grp{text-align:center;font-size:var(--fs-small);color:var(--dim);
border-bottom:1px solid var(--line);padding-bottom:var(--s1)}
th.grp+th.grp{border-left:1px solid var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.sortable::after{content:"\2195";opacity:.3;margin-left:var(--s1);font-size:10px}
th.sorted::after{content:"\25B2";opacity:.9}
th.sorted[data-dir=desc]::after{content:"\25BC"}
table.t2 th:not(:first-child),table.t2 td:not(:first-child){width:1px;
white-space:nowrap}
td .dim[style]{font-size:var(--fs-small)!important;margin-top:1px}
tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr:target td{background:color-mix(in srgb,var(--accent) 14%,transparent);
transition:background .4s}
tr:target{scroll-margin-top:60px}
tr.flash td{background:var(--mid-bg);transition:background .25s}
td.tid{white-space:nowrap;text-align:right}
td.hit{font-weight:600;width:1px;white-space:nowrap;text-align:right}
td.hit em{font-style:normal;font-weight:400;color:var(--dim);
font-size:var(--fs-small);margin-left:var(--s1)}
/* --quiet only ever renders a "nothing to see here" dot whose meaning
   lives in the tooltip; everything else clears 4.5:1 in both themes */
td.hit.ok{color:var(--quiet);text-align:center;font-weight:400}
td.hit.calm{color:var(--fg);font-weight:400;text-align:right}
td.hit.good{color:var(--ok-fg);font-weight:500}
td.hit.mid{color:var(--mid-fg)} td.hit.bad{color:var(--hot-fg)}
.obs>div{display:flex;gap:var(--s4);padding:var(--s1) 0}
.obs b{flex:0 0 6em;font-weight:600}
.obs span{color:var(--dim)}
.obs .jump{margin-right:var(--s2)}
td.prompt{white-space:normal;width:100%;min-width:240px;color:var(--dim);
overflow-wrap:anywhere;position:relative}
td.skill{color:var(--mid)}
td.memo{white-space:normal;max-width:300px;min-width:180px;overflow-wrap:anywhere}
td.memo .used{display:block;color:var(--accent);font-size:var(--fs-small)}
td.memo .topic{display:block;color:var(--dim);font-size:var(--fs-small)}
td.tools{width:1px;max-width:150px}
td.tools span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ts{white-space:nowrap;font-variant-numeric:tabular-nums}
td.ts .d{display:block;width:fit-content;background:var(--mid-bg);
color:var(--mid-fg);font-weight:600;font-size:var(--fs-small);padding:0 6px;
border-radius:var(--r-s);margin:0 0 2px}
td.ty{font-size:var(--fs-small);color:var(--dim)}
td.ty.over{color:var(--hot-fg);font-weight:600;background:var(--hot-bg);
box-shadow:inset 2px 0 0 var(--hot)}
td.kinds{white-space:nowrap;font-size:var(--fs-small);width:1px}
td.tok{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
td.tok span{display:block}
td.tok b{font-weight:400;color:var(--dim);margin-left:7px;margin-right:2px}
td.tok span b:first-child{margin-left:0}
td.tok.over{color:var(--warn)}
td.mdlc{white-space:normal;min-width:64px;line-height:1.9}
td.prob{white-space:normal;line-height:1.5;min-width:110px;max-width:200px}
td.prob .pb{white-space:normal}
.mbar{display:inline-block;width:44px;height:5px;border-radius:3px;
background:var(--grid);margin-right:6px;vertical-align:middle;overflow:hidden}
.mbar i{display:block;height:100%;background:currentColor;opacity:.55}
#ms{margin-left:var(--s2)}

/* ---------- chips: one shape for every tag ---------- */
.pb,.mdl,.cls,.flag,.warnchip,.kn,.fbox em,.lvh em{display:inline-block;
font-size:var(--fs-small);line-height:1.6;padding:0 7px;border-radius:var(--r-s);
background:var(--chip);color:var(--dim);font-style:normal;white-space:nowrap;
font-weight:400;border:0;vertical-align:baseline}
td.prob .pb{margin:2px 4px 2px 0}
.pb.rep{background:var(--chip);color:var(--dim)}
.pb.ctx{background:var(--hot-bg);color:var(--hot-fg)}
.pb.cache,.pb.slow{background:var(--warn-bg);color:var(--warn-fg)}
.pb.scr{background:#a371f7;color:#fff;white-space:nowrap!important}   /* same as the pipeline page's 臨時腳本 tag */
.mdl{margin-right:3px;padding:0 6px}
.mdl em{font-style:normal;margin-left:3px;opacity:.75}
.mdl.opus{color:var(--acc-fg);background:var(--acc-bg)}
.mdl.sonnet{color:var(--ok-fg);background:var(--ok-bg)}
.mdl.haiku,.mdl.fable{color:var(--mid-fg);background:var(--mid-bg)}
.cls{margin-right:6px}
/* .g only removes the fill, so the text colour has to stand on the card
   by itself */
.cls.g{background:transparent;box-shadow:inset 0 0 0 1px currentColor;opacity:.8}
.flag{background:var(--warn-bg);color:var(--warn-fg);margin-right:5px}
.warnchip{background:var(--mid-bg);color:var(--mid-fg);margin-right:5px}
.kn{margin-right:var(--s1)}
.kn em{font-style:normal;margin-left:var(--s1);opacity:.7}
a.jump{color:var(--accent);background:var(--acc-bg);padding:0 6px;
border-radius:var(--r-s);font-size:var(--fs-small);font-family:var(--mono);
text-decoration:none}
a.jump:hover{text-decoration:underline}

/* ---------- buttons / inputs ---------- */
button{background:var(--accent);color:var(--card);border:0;
border-radius:var(--r-s);padding:6px var(--s3);font:inherit;
font-size:13px;cursor:pointer;line-height:1.4}
button.ghost{background:var(--card);color:var(--fg);
box-shadow:inset 0 0 0 1px var(--line)}
button.ghost:hover{background:var(--hover)}
button:disabled{opacity:.5;cursor:default}
select,input[type=date]{background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:var(--r-s);padding:5px var(--s2);
font:inherit;font-size:13px;line-height:1.4}
button.forget{background:none;border:0;color:var(--dim);cursor:pointer;
font-size:14px;line-height:1;padding:0 2px;opacity:.4;box-shadow:none}
button.forget:hover{opacity:1;color:var(--warn)}

/* ---------- home: found list + range form + months ---------- */
ul.found{list-style:none;margin:var(--s5) 0 0;padding:0;
border:1px solid var(--line);border-radius:var(--r);background:var(--card);
overflow:hidden}
ul.found li+li{border-top:1px solid var(--grid)}
ul.found a{display:flex;gap:var(--s4);padding:var(--s3) var(--s5);
text-decoration:none;color:var(--fg);align-items:baseline}
ul.found a:hover{background:var(--hover)}
ul.found b{flex:0 0 9em;font-size:var(--fs-body)}
ul.found span{color:var(--dim);font-size:var(--fs-body)}
a.next{display:block;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:var(--s3) var(--s5);margin:var(--s3) 0;
text-decoration:none;color:var(--fg)}
a.next b{display:block;font-size:var(--fs-h)}
a.next span{color:var(--dim);font-size:var(--fs-body)}
a.next:hover{border-color:var(--accent)}
.rng{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
font-size:13px;color:var(--dim);margin:0 0 var(--s4)}
.rng label{display:inline-flex;align-items:center;gap:6px}
.rqs{display:flex;gap:var(--s4);flex-wrap:wrap;margin-left:auto}
.rng a.rq{color:var(--dim);text-decoration:none}
.rng a.rq:hover{color:var(--fg)}
.rng a.rq.on{color:var(--fg);font-weight:600;
box-shadow:inset 0 -2px 0 var(--accent)}
.wrap>.rng{margin-top:var(--s4)}
.acc{display:flex;flex-direction:column;gap:var(--s2)}
.acc .mh{display:flex;align-items:baseline;gap:var(--s3);width:100%;
background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:var(--s3) var(--s4);color:var(--dim);font:inherit;font-size:13px;
cursor:pointer;text-align:left;box-shadow:none}
.acc .mh b{color:var(--fg);font-size:var(--fs-body)}
.acc .mh:hover{background:var(--hover)}
.acc .mh:before{content:"▸";color:var(--dim);font-size:13px;width:12px}
.acc .mon.on>.mh:before{content:"▾"}
.acc .mon.on>.mh{border-radius:var(--r) var(--r) 0 0;border-bottom-color:var(--grid)}
.acc .mb{display:none;padding:0}
.acc .mon.on>.mb{display:block}
.acc .mon.on>.mb>.tw{border-top:0;border-radius:0 0 var(--r) var(--r)}

/* ---------- stat tiles ---------- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:var(--s3);margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:14px var(--s4);display:flex;flex-direction:column;gap:2px}
.stat.hot b{color:var(--hot-fg)}
a.stat{color:var(--fg);text-decoration:none}a.stat:hover{border-color:var(--accent)}
.stat b{display:block;font-size:24px;font-weight:700;
font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.stat span{color:var(--dim);font-size:var(--fs-small)}
.stat>span:first-of-type{color:var(--fg);font-size:13px}
.stat .tip{display:block;margin-top:var(--s1);color:var(--dim);
font-size:var(--fs-small);line-height:1.5}
@media(max-width:760px){.hero{grid-template-columns:repeat(2,1fr)}.stat b{font-size:20px}}
.stat.big b{font-size:28px;color:var(--fg)}
.stat b.link{font-size:var(--fs-h);font-family:var(--mono)}
.stat.tap{cursor:pointer;position:relative}
.stat.tap:hover{border-color:var(--accent)}
.stat.tap.off{opacity:.5;cursor:default}
.hero.tight{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:var(--s2);margin:var(--s3) 0 0}
.hero.tight .stat{padding:var(--s3)}
.hero.tight .stat b{font-size:18px}

/* ---------- session page ---------- */
.resume{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
margin:var(--s4) 0 0;font-size:13px}
.resume code{background:var(--card);border:1px solid var(--line);
padding:5px var(--s3);border-radius:var(--r-s);font-size:12px;user-select:all}
.resume button{padding:5px var(--s3)}
.sk{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
padding:var(--s2) 0;border-bottom:1px solid var(--grid);font-size:13px}
.sk:last-of-type{border-bottom:none}
.sk .mono{min-width:130px}
.sk b{font-variant-numeric:tabular-nums;font-size:13px}
.rp{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;
font-size:13px;padding-bottom:var(--s2);color:var(--dim)}
.rp b{font-size:var(--fs-body);color:var(--fg)}
.lays{margin-top:var(--s2)}
.lay{display:grid;grid-template-columns:80px 110px 150px 1fr;gap:var(--s3);
padding:var(--s2) 0;border-bottom:1px solid var(--grid);font-size:13px;
align-items:baseline}
.lay:last-child{border-bottom:none}
.lay code{font-size:var(--fs-small);color:var(--acc-fg)}
.lay span{color:var(--dim)}
.verdict{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:var(--s4) var(--s5);margin:var(--s5) 0 0;
box-shadow:inset 3px 0 0 var(--line)}
.verdict.bad{box-shadow:inset 3px 0 0 var(--warn)}
.verdict.mid{box-shadow:inset 3px 0 0 var(--mid)}
.verdict.ok,.verdict.good{box-shadow:inset 3px 0 0 var(--ok)}
.vhead{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
margin-bottom:var(--s1)}
.vhead b,.verdict.good b{font-size:var(--fs-h)}
.vhead b.bad{color:var(--warn-fg)} .vhead b.mid{color:var(--mid-fg)}
.vhead b.ok,.verdict.good b.ok{color:var(--ok-fg)}
.vhead span,.verdict.good span{color:var(--dim);font-size:13px}
.verdict.good b{display:block;margin-bottom:3px}
.vitem{border-top:1px solid var(--grid);padding:var(--s3) 0 2px;margin-top:var(--s3)}
.vt{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s1)}
.vt b{font-size:var(--fs-body)}
.vt em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--hot-fg)}
.vitem p{margin:3px 0;font-size:13px;color:var(--dim)}

<script>
// Radio tabs are CSS-only, so a reload (and the page refreshes itself every
// three minutes) would always drop back to the first tab. Remember the pick.
(function(){
  document.querySelectorAll(".sw[id]").forEach(function(sw){
    var key="sw:"+sw.id, want=null;
    try{ want=localStorage.getItem(key); }catch(e){}
    if(want){ var r=document.getElementById(want); if(r) r.checked=true; }
    sw.querySelectorAll("input[type=radio]").forEach(function(r){
      r.addEventListener("change",function(){
        try{ localStorage.setItem(key, r.id); }catch(e){}
      });
    });
  });
})();
// Drop one session's agent-perform record. Was a separate perfboard server;
// one board is enough.
(function(){
  document.querySelectorAll("button.forget[data-sid]").forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var sid=b.dataset.sid;
      if(!confirm("刪除 "+sid+" 這個對話？\n"
        +"· 判定紀錄會從 session_types.json 等檔案移除\n"
        +"· 對話本身（.jsonl）會移到「垃圾桶」\n"
        +"· claude --resume "+sid+" 之後就不能用了\n\n"
        +"判定紀錄可從 .agent_perform_forgotten.jsonl 還原，"
        +"對話本身從垃圾桶拉回來。")) return;
      fetch("/forget",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({session:sid})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(!d.ok){ alert("刪除失敗："+d.error); return; }
          var row=b.closest("tr"); if(row) row.remove();
        }).catch(function(err){ alert("刪除失敗："+err); });
    };
  });
})();
// /optimize: start a prompt-audit run, then reload until it finishes.
(function(){
  var b=document.querySelector("button.audit-run");
  if(!b) return;
  if(b.dataset.running){ setTimeout(function(){location.reload();},15000); return; }
  b.onclick=function(){
    b.disabled=true; b.textContent="健檢中…";
    fetch("/optimize/run",{method:"POST"}).then(function(){location.reload();})
      .catch(function(){b.disabled=false; b.textContent="執行健檢";});
  };
})();
// Summary tiles open the detail they summarise, so three stacked cards do
// not push the turn table below the fold.
(function(){
  document.querySelectorAll(".stat.tap:not(.off)").forEach(function(t){
    t.onclick=function(){
      var m=document.getElementById(t.dataset.modal);
      if(m) m.classList.add("open");
    };
  });
  document.querySelectorAll(".modal").forEach(function(m){
    m.addEventListener("click",function(e){
      if(e.target===m||e.target.classList.contains("x")) m.classList.remove("open");
    });
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape")
      document.querySelectorAll(".modal.open").forEach(function(m){
        m.classList.remove("open");});
  });
})();
// Chart hit rects: show the day's card; a click also follows data-go.
function tipAt(h){
  var card=h.closest(".nchart"),t=card.querySelector(".ctip");
  if(!t){t=document.createElement("div");t.className="ctip";card.appendChild(t);}
  t.innerHTML=h.dataset.pop;
  var r=h.getBoundingClientRect(),c=card.getBoundingClientRect(),x=r.right-c.left+8;

// Picking a day swaps in that day's comparison without reloading the page.
var dayHTML={},wantDay="";

function pickDay(h){
  var box=document.getElementById("vbody"),go=h.dataset.go;
  hideTip();h.classList.add("on");tipAt(h);
  if(!box){location.href=go;return;}
  wantDay=go;
  box.querySelectorAll(".nlist,.lede").forEach(function(e){e.classList.add("busy");});
  var hd=box.querySelector("#list");
  if(hd&&!hd.querySelector(".upd")){var u=document.createElement("span");u.className="upd";u.textContent="更新中…";hd.appendChild(u);}

// Copy the resume command. execCommand is the fallback because the
// clipboard API needs a secure context and 127.0.0.1 over plain http is
// only sometimes treated as one.
(function(){
  var msg=document.getElementById("cpm");
  function copy(text,btn){
    function done(ok){
      if(msg) msg.textContent = ok ? "已複製" : "複製失敗，請手動選取";
      setTimeout(function(){ if(msg) msg.textContent=""; },2000);
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){done(true);},
                                              function(){fallback(text,done);});
    } else { fallback(text,done); }
  }
  function fallback(text,done){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); done(ok);
  }
  ["cp","cp2"].forEach(function(id){
    var b=document.getElementById(id);
    if(b) b.onclick=function(){ copy(b.dataset.t,b); };
  });
})();
// A header sits over the same edge as its numbers: right-align any th whose
// column's first data cell is right-aligned.
function alignHeads(root){
  root.querySelectorAll("table").forEach(function(t){
    var hr=null, dr=null;
    for(var i=0;i<t.rows.length;i++){
      var r=t.rows[i];
      if(!hr && r.querySelector("th") && !r.querySelector("td")){ hr=r; continue; }
      if(hr && r.querySelector("td")){ dr=r; break; }
    }
    if(!hr||!dr) return;
    Array.prototype.forEach.call(hr.cells,function(th,k){
      var c=dr.cells[th.dataset.col!=null?+th.dataset.col:k];
      if(c && getComputedStyle(c).textAlign==="right") th.classList.add("num");
    });
  });
}

// Theme: follow the system unless the reader picked one.
(function(){

  var b=document.getElementById("theme");
  if(b) b.onclick=function(){

// Sort any table by clicking a header. Values are parsed from the rendered
// text, so $1,234 / 98% / 1.2M / 1m24s all sort as numbers.
function val(td){
  // A cell that mixes a number with a suffix ($5.04 98%) cannot be parsed
  // back out of its own text -- it sorted as a string and put $5.04 above
  // $44.81. Composite cells carry data-v and it always wins.
  if(td.dataset && td.dataset.v!==undefined){
    var d=parseFloat(td.dataset.v);
    return isNaN(d) ? td.dataset.v : d;
  }
  var t=(td.textContent||"").trim();
  if(!t||t==="--"||t==="\u2014") return -Infinity;
  var v=num(t);
  // A number cell with a tail (39m15s↳ sub 3m53s, 26 / 54, $2.01 +4%) sorts by its first figure.
  if(typeof v==="string"&&td.classList&&td.classList.contains("num")){
    var w=num(t.split(/[\s\u21b3]+/)[0]); if(typeof w==="number") return w;
  }
  return v;
}
function num(t){
  var m=t.match(/^#(\d+)$/); if(m) return +m[1];
  m=t.match(/^(\d+):(\d\d)(?::(\d\d))?$/); if(m) return m[3]?(+m[1]*60+ +m[2])*60+ +m[3]:+m[1]*60+ +m[2];
  m=t.match(/^\u00d7([\d.]+)$/); if(m) return +m[1];
  m=t.match(/^(\d+)m(\d+)s$/); if(m) return +m[1]*60+ +m[2];
  m=t.match(/^([\d.]+)s$/); if(m) return +m[1];
  m=t.match(/^(\d+)m$/); if(m) return +m[1];
  m=t.match(/^\$([\d,.]+)$/); if(m) return parseFloat(m[1].replace(/,/g,""));
  m=t.match(/^([\d.]+)%/); if(m) return +m[1];
  m=t.match(/^([\d.]+)([kM])$/); if(m) return +m[1]*(m[2]==="k"?1e3:1e6);
  m=t.match(/^([\d.]+)\u2605$/); if(m) return +m[1];
  if(/^[\d.,]+$/.test(t)) return parseFloat(t.replace(/,/g,""));
  return t.toLowerCase();
}
// A sort you picked has to survive a reload -- the page re-renders on every
// refresh, and losing the order each time made the control useless. The key is
// the KIND of page, not the URL, so the choice carries from one session's
// table to the next instead of being remembered per session id.
function pageKind(){
  var q=location.search;
  // /pipeline carries ?session= too; its tables are not the session page's
  if(location.pathname!=="/") return location.pathname+(/[?&]agent=/.test(q)?":agent":"");
  if(/[?&]session=/.test(q)) return "session";
  if(/[?&]day=/.test(q)) return "day";
  return location.pathname;
}
function sortKey(tb,idx){
  return "sort:"+pageKind()+":"+(tb.dataset.sortkey||idx);
}
function applySort(tb,i,dir){
  var body=tb.tBodies[0]; if(!body) return;
  var ths=tb.querySelectorAll("thead tr:last-child th");
  ths.forEach(function(o){o.removeAttribute("data-dir");
                          o.classList.remove("sorted");});
  var th=ths[i]; if(!th) return;
  th.dataset.dir=dir===1?"asc":"desc"; th.classList.add("sorted");
  var c=th.dataset.col?+th.dataset.col:i;
  Array.from(body.rows).sort(function(a,b){
    var x=val(a.cells[c]),y=val(b.cells[c]);
    if(typeof x==="string"||typeof y==="string")
      return String(x).localeCompare(String(y))*dir;
    return (x-y)*dir;
  }).forEach(function(r){body.appendChild(r);});
}
function initSort(root){
root.querySelectorAll("table").forEach(function(tb,idx){
  if(tb.dataset.fixed!==undefined) return; // lens and month tables keep their server order
  tb.querySelectorAll("thead tr:last-child th").forEach(function(th,i){
    th.classList.add("sortable");
    th.addEventListener("click",function(){
      var dir=th.dataset.dir==="asc"?-1:1;
      applySort(tb,i,dir);
      try{ localStorage.setItem(sortKey(tb,idx),
                                i+":"+(dir===1?"asc":"desc")); }catch(e){}
    });
  });
  var want=null;
  try{ want=localStorage.getItem(sortKey(tb,idx)); }catch(e){}
  if(!want) want=tb.dataset.defaultsort||null;   // newest first, until changed
  if(want){
    var parts=want.split(":");
    applySort(tb,+parts[0],parts[1]==="desc"?-1:1);
  }
});
}
initSort(document);

// The context chart: option JSON rides in a data attribute, but formatters
// are functions, so they get attached here.
(function(){
  var boxes=document.querySelectorAll(".ctxc");
  if(!boxes.length||typeof echarts==="undefined") return;
  function tk(v){
    if(v>=1e6) return (v/1e6).toFixed(1)+"M";
    return v>=1000?(v/1000).toFixed(0)+"k":String(v);
  }
  boxes.forEach(function(el){
    var opt=JSON.parse(el.dataset.opt), lim=+el.dataset.limit||1;
    opt.yAxis.axisLabel={formatter:tk};
    opt.tooltip.formatter=function(ps){
      var out="第 "+ps[0].axisValue+" 回合";
      ps.forEach(function(p){
        if(p.data==null||p.data.value==null) return;
        out+="<br>"+p.marker+p.seriesName+" "+tk(p.data.value)
            +" ("+(p.data.value/lim*100).toFixed(1)+"%) · "+p.data.src;
      });
      return out;
    };
    // The page has its own light/dark toggle; a chart hard-wired to "dark"
    // painted a dark grid onto the light page.
    var th=document.documentElement.dataset.theme;
    if(!th) th=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
    var ch=echarts.init(el,th==="dark"?"dark":null);
    ch.setOption(opt);
    function jump(i){
      var r=document.getElementById("t"+(i+1));
      if(!r) return;
      r.scrollIntoView({behavior:"smooth",block:"center"});
      r.classList.add("flash");
      setTimeout(function(){ r.classList.remove("flash"); },1200);
    }
    // ch.on("click") only fires on a 6px symbol, so most clicks landed on
    // nothing. The zrender layer catches the whole plot area and the x
    // pixel is enough to name the turn.
    ch.getZr().on("click",function(e){
      var pt=[e.offsetX,e.offsetY];
      if(!ch.containPixel("grid",pt)) return;
      jump(Math.round(ch.convertFromPixel({seriesIndex:0},pt)[0]));
    });
    el.style.cursor="pointer";
    window.addEventListener("resize",function(){ ch.resize(); });
  });
})();

// Cost/token combo chart: one echarts instance
// per box, a <select> picks which entry's option is live. data-opts is a
// JSON array of {unit, opt}; data-unit picks which formatter applies.
(function(){
  var boxes=document.querySelectorAll(".pctc[data-opts]");
  if(!boxes.length||typeof echarts==="undefined") return;
  function dl(v){ return v==null?"":"$"+(+v).toFixed(2); }
  function dtok(v){
    if(v==null) return "";
    v=+v;
    return v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(1)+"k":String(Math.round(v));
  }
  var FMT={tok:dtok};
  boxes.forEach(function(el){
    var entries=JSON.parse(el.dataset.opts);
    var sel=el.previousElementSibling;
    var th=document.documentElement.dataset.theme;
    if(!th) th=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
    var ch=echarts.init(el,th==="dark"?"dark":null);
    function apply(i){
      var entry=entries[i];
      var opt=JSON.parse(JSON.stringify(entry.opt));
      var fmt=FMT[entry.unit]||dl;
      opt.yAxis.axisLabel={formatter:fmt};
      opt.tooltip.formatter=function(ps){
        var out=ps[0].axisValue;
        ps.forEach(function(p){
          if(p.data==null) return;
          out+="<br>"+p.marker+p.seriesName+" "+fmt(p.data);
        });
        return out;
      };
      ch.setOption(opt,true);
    }
    apply(0);
    if(sel) sel.addEventListener("change",function(){ apply(+sel.value); });
    window.addEventListener("resize",function(){ ch.resize(); });
  });
})();

// "複製給 AI 分析": the bundle is prefetched on hover so the click can copy while the browser still
// counts it as a user gesture; ClipboardItem takes a promise for the same reason. If both fail, the
// text is shown selected in a box for a manual copy.
(function () {
  var cache = {};
  function load(sec) {
    return cache[sec] || (cache[sec] = fetch('/levers/bundle?section=' + sec + '&' + location.search.slice(1))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }));
  }
  function manual(t) {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:5% 10%;z-index:99;background:#fff;border:1px solid #888;padding:12px;display:flex;flex-direction:column;gap:8px';
    box.innerHTML = '<div>自動複製失敗，請按 ⌘C／Ctrl+C 複製後關閉　<button>關閉</button></div>';
    var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'flex:1;font:12px monospace';
    box.appendChild(ta); document.body.appendChild(box); ta.focus(); ta.select();
    box.querySelector('button').onclick = function () { box.remove(); };
  }
  document.addEventListener('mouseover', function (e) {
    var b = e.target.closest && e.target.closest('button[data-bundle]'); if (b) load(b.dataset.bundle).catch(function () {});
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-bundle]');
    if (!b) return;
    var label = b.textContent, p = load(b.dataset.bundle);
    var done = function (t) { b.textContent = t; setTimeout(function () { b.textContent = label; }, 2000); };
    var viaItem = window.ClipboardItem && navigator.clipboard && navigator.clipboard.write
      ? navigator.clipboard.write([new ClipboardItem({'text/plain': p.then(function (t) { return new Blob([t], {type: 'text/plain'}); })})])
      : Promise.reject();
    viaItem.then(function () { done('已複製'); }, function () {
      p.then(function (t) {
        if (navigator.clipboard && window.isSecureContext)
          return navigator.clipboard.writeText(t).then(function () { done('已複製'); }, function () { manual(t); });
        manual(t);
      }, function (err) { done('讀取失敗：' + err.message); });
    });
  });
})();

// Loading bar: server-rendered pages can be slow, so show what is being opened until the browser swaps pages.
(function () {
  var bar = document.createElement('div'); bar.id = 'ld'; bar.innerHTML = '<span></span><i></i>'; document.body.appendChild(bar);
  var names = {'/': '總覽', '/how': '怎麼算', '/optimize': '優化', '/expensive': '最貴的回合', '/pipeline': '對話流程'};
  function show(u) {
    var q = u.searchParams, n = u.pathname === '/' && q.get('day') ? '單日明細 ' + q.get('day') : names[u.pathname.replace(/(.)\/$/, '$1')] || '頁面';
    bar.firstChild.textContent = '載入 ' + n + '…'; bar.style.display = 'block';
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
    var u = new URL(a.href, location.href);
    if (u.origin !== location.origin || (u.pathname === location.pathname && u.search === location.search)) return;
    show(u);
  });
  document.addEventListener('submit', function () { show(new URL(location.href)); });
  window.addEventListener('pageshow', function () { bar.style.display = 'none'; });
})();

// Instant tooltip for every [title]: the native one waits about a second and often never shows.
(function () {
  var tip = document.createElement('div'), cur = null;
  tip.style.cssText = 'position:fixed;z-index:1000;max-width:360px;padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;white-space:pre-line;pointer-events:none;display:none;background:var(--fg);color:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25)';
  document.body.appendChild(tip);
  function hide() { if (cur) { cur.setAttribute('title', cur.dataset.t); cur = null; } tip.style.display = 'none'; }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest && e.target.closest('[title]');
    if (!el || el === cur) return;
    hide();
    var t = el.getAttribute('title'); if (!t) return;
    cur = el; el.dataset.t = t; el.removeAttribute('title');
    tip.textContent = t; tip.style.display = 'block';
    var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    tip.style.top = (r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
  });
  document.addEventListener('mouseout', function (e) { if (cur && !cur.contains(e.relatedTarget)) hide(); });
  addEventListener('scroll', hide, true);
})();
