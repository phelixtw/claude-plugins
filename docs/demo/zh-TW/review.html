four\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"card-header\"\u003e\n          \u003cdiv class=\"card-dot amber\"\u003e\u003c/div\u003e\n          \u003ch3\u003eCard Title 2\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cul\u003e\n          \u003cli\u003e\u0026bull; Item one\u003c/li\u003e\n          \u003cli\u003e\u0026bull; Item two\u003c/li\u003e\n          \u003cli\u003e\u0026bull; Item three\u003c/li\u003e\n          \u003cli\u003e\u0026bull; Item four\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"card-header\"\u003e\n          \u003cdiv class=\"card-dot violet\"\u003e\u003c/div\u003e\n          \u003ch3\u003eCard Title 3\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cul\u003e\n          \u003cli\u003e\u0026bull; Item one\u003c/li\u003e\n          \u003cli\u003e\u0026bull; Item two\u003c/li\u003e\n          \u003cli\u003e\u0026bull; Item three\u003c/li\u003e\n          \u003cli\u003e\u0026bull; Item four\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003c!-- ARCHIFY:CARDS_SLOT_END --\u003e\n\n  \u003c/div\u003e\n\n  \u003cscript\u003e\n    /* review-store pure */\n    // The Jira ticket key in the title, used by the refresh command.\n    function archifyTicketOf(title) { var m = /\\b[A-Z][A-Z0-9]+-\\d+\\b/.exec(title || ''); return m ? m[0] : ''; }\n    // Command copied by the review page's Refresh button; done / skip are 1-based TODO item numbers. Paths with spaces are quoted.\n    function archifyRefreshCommand(ticket, repo, done, skip) {\n      var q = function (v) { return /\\s/.test(v) ? '\"' + v + '\"' : v; };\n      return '/archify-review refresh ' + q(ticket) + (repo ? ' --repo ' + q(repo) : '')\n        + (done.length ? ' --done ' + done.join(',') : '') + (skip.length ? ' --skip ' + skip.join(',') : '');\n    }\n    function archifyNextCommand(report) { return '/archify-review next ' + report; }\n    // code-review-graph's own cut-offs for a 0-1 blast-radius score: high above 0.70, medium above 0.40.\n    function archifyRiskLevel(score) { return score \u003e 0.7 ? 'high' : score \u003e 0.4 ? 'medium' : 'low'; }\n    // Review state of one report in localStorage: TODO Done / Skip by item text, ticks by line key.\n    // Keys missing from the current report are kept, so they come back when a later report has them again.\n    function archifyStateStore(id, storage) {\n      var key = 'archify-review-state:' + id, s = null;\n      try { s = JSON.parse(storage.getItem(key)); } catch (_) {}\n      s = s \u0026\u0026 typeof s === 'object' ? s : {};\n      s.todo = s.todo || {}; s.ticks = s.ticks || {};\n      return {\n        todo: s.todo,\n        ticks: s.ticks,\n        save: function () { s.updatedAt = new Date().toISOString(); try { storage.setItem(key, JSON.stringify(s)); } catch (_) {} }\n      };\n    }\n    /* end review-store pure */\n    /* todo-fix pure */\n    // Self-contained prompt for an AI coding agent to fix LOW findings; items are plain finding strings, \"text (file:line, ...)\".\n    // Ticket, commit and the numbered findings with their locations, shared by the AI Fix and Ask AI prompts.\n    function archifyPromptBody(out, items, title, changes) {\n      var commit = ((changes \u0026\u0026 changes.commits) || [])[0];\n      if (title) out.push('Ticket: ' + title);\n      if (commit) out.push('Commit: ' + commit.sha + (commit.subject ? ' ' + commit.subject : ''));\n      items.forEach(function (it, i) {\n        var loc = /\\s*[(（]([^()（）\\s:]+):(\\d+)(?:[,，]\\s*([^)）]*))?[)）]\\s*$/.exec(it);\n        out.push((items.length \u003e 1 ? (i + 1) + '. ' : '') + 'Finding: ' + (loc ? it.slice(0, loc.index) : it));\n        if (loc) out.push('   Location: ' + loc[1] + ':' + loc[2] + (loc[3] ? ' (' + loc[3] + ')' : ''));\n      });\n      return out;\n    }\n    // AI Fix (LOW items). kind 'smell': cut an over-engineering finding (ponytail-review) instead of a code-review fix.\n    function archifyFixPrompt(items, title, changes, kind) {\n      var smell = kind === 'smell';\n      var out = archifyPromptBody([smell\n        ? 'Simplify ' + (items.length \u003e 1 ? items.length + ' LOW-risk over-engineering findings' : 'one LOW-risk over-engineering finding') + ' in this change.'\n        : 'Fix ' + (items.length \u003e 1 ? items.length + ' LOW-severity code-review findings' : 'one LOW-severity code-review finding') + ' in this change.'], items, title, changes);\n      out.push(smell\n        ? 'Cut the code or swap in the named replacement; behavior must not change. Make the diff shorter, add nothing new; run the existing tests before and after; do not commit.'\n        : 'Make the minimal fix only, add or adjust a test if appropriate, and do not commit.');\n      return out.join('\\n');\n    }\n    // Ask AI (MEDIUM and HIGH items): a question about one item; the AI answers and does not edit.\n    function archifyAskPrompt(item, severity, title, changes, kind) {\n      var level = String(severity).toUpperCase();\n      var what = kind === 'smell' ? level + '-risk over-engineering finding' : level + '-severity ' + (kind === 'security' ? 'security-review' : 'code-review') + ' finding';\n      var out = archifyPromptBody(['Look into one ' + what + ' in this change and answer it.'], [item], title, changes);\n      out.push(kind === 'smell'\n        ? 'Read the code around the location, say whether cutting it is worth it here and why, and list what to delete or replace and which callers change. Do not edit files.'\n        : 'Read the code around the location, say whether it is a real problem and why, and propose the smallest fix. Do not edit files.');\n      return out.join('\\n');\n    }\n    /* end todo-fix pure */\n    /* diff-lines pure */\n    // Classifies and numbers each raw diff line as the viewer shows it; the review ticks key on the same numbers.\n    // A git header `@@ -old,n +new,n @@` numbers deleted lines by the old file and the rest by the new; `:N` sets the new-file start only.\n    function archifyDiffLines(diff) {\n      var prev = 0, next = 0, hunk = 0;\n      return String(diff || '').replace(/\\n+$/, '').split('\\n').map(function (raw) {\n        var mark = raw.charAt(0);\n        var kind = mark === '+' ? 'add' : mark === '-' ? 'del' : raw.indexOf('@@') === 0 ? 'hunk' : mark === '\\\\' ? 'note' : 'ctx';\n        if (kind === 'hunk') {\n          var git = /^@@ -(\\d+)(?:,\\d+)? \\+(\\d+)/.exec(raw);\n          var start = !git \u0026\u0026 /:(\\d+)\\s*$/.exec(raw);\n          if (git) { prev = Number(git[1]); next = Number(git[2]); }\n          if (start) { prev = 0; next = Number(start[1]); }\n          return { raw: raw, kind: kind, hunk: ++hunk, numbered: false, num: '' };\n        }\n        // `numbered`: the line sits in a numbered hunk. `\\ No newline at end of file` belongs to the line above and takes no number.\n        var numbered = Boolean(next || prev);\n        var num = !numbered || kind === 'note' ? '' : kind === 'del' ? (prev ? String(prev++) : '') : (next ? String(next++) : '');\n        var old = numbered \u0026\u0026 kind === 'ctx' \u0026\u0026 prev ? String(prev++) : '';\n        return { raw: raw, kind: kind, hunk: hunk, numbered: numbered, num: num, old: old };\n      });\n    }\n    /* end diff-lines pure */\n    // A report page keeps its review state in localStorage; a standalone page keeps it for this page session only.\n    var archifyReviewState = null;\n    try { if (window.archifyReportPayload) archifyReviewState = archifyStateStore(window.archifyReportPayload.id, localStorage); } catch (_) {}\n    // Turns each TODO card (title contains TODO or 待確認: open questions / code review, security review) into a per-item Done / Skip checklist.\n    Array.prototype.filter.call(document.querySelectorAll('.cards .card'), function (c) {\n      var h = c.querySelector('h3'); return h \u0026\u0026 /TODO|待確認/i.test(h.textContent);\n    }).forEach(function (card) {\n      var zh = /^zh/i.test(document.documentElement.lang || '');\n      var t = zh ? { count: '已處理 ' } : { count: 'Handled ' };\n      t.fix = '{{i18n:viewer.todo.copyFix}}'; t.fixAll = '{{i18n:viewer.todo.copyAllLow}}'; t.ask = '{{i18n:viewer.todo.askAi}}'; t.mark = '{{i18n:viewer.todo.mark}}';\n      var list = card.querySelector('ul'), count = document.createElement('span');\n      count.className = 'todo-count';\n      card.querySelector('.card-header').appendChild(count);\n      list.classList.add('todo-list');\n      var lis = list.children;\n      // Review tabs: security-review items (and its skipped note), code-smell items, and everything else as Code Review.\n      var tabOf = function (li) {\n        return /\\[security-review\\]|\\[skipped\\]\\s*security-review/i.test(li.textContent) ? 'security'\n          : /\\[code-smell\\]|\\[skipped\\]\\s*code-smell/i.test(li.textContent) ? 'smell' : 'code';\n      };\n      var lows = { code: [], security: [], smell: [] };\n      function heading() { return ((document.querySelector('h1') || {}).textContent || '').trim(); }\n      function promptBtn(cls, label, prompt) {\n        var b = document.createElement('button');\n        b.type = 'button'; b.className = cls + ' no-print'; b.textContent = label;\n        b.addEventListener('click', function () { Archify.copyThen(prompt(), b, label); });\n        return b;\n      }\n      function copyBtn(label, items, kind) {\n        return promptBtn('todo-fix', label, function () { return archifyFixPrompt(items(), heading(), Archify.codeData.changes(), kind); });\n      }\n      // A ticked item is marked handled; stored as 'do' (an older viewer's 'skip' also counts as ticked).\n      function paint(li, on) {\n        if (on) li.dataset.state = 'do'; else delete li.dataset.state;\n        li.querySelector('input.todo-check').checked = Boolean(on);\n        count.
